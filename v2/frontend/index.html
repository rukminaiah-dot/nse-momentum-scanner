<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NSE Momentum Scanner V2</title>
<style>
body{font-family:Arial;background:#10131a;color:#fff;margin:15px}
h2{color:#4ade80}
.card{background:#1c2230;padding:14px;margin:10px 0;border-radius:10px}
.buy{color:#4ade80}.sell{color:#fb7185}
small{color:#aaa}
.target{color:orange;font-weight:bold}
.profit{color:#4ade80;font-weight:bold}
.loss{color:#fb7185;font-weight:bold}
</style>
</head>
<body>
<h2>NSE Momentum Scanner V2</h2>
<div id="feed-status" class="card">Checking market and feed freshness…</div>
<h3>Market Index Signals</h3>
<div id="indices">Loading live indices...</div>
<h3>Top 5 Verified Momentum Setups</h3>
<div id="scanner">Waiting for live market data...</div>
<h3>NIFTY 200 Stock Board</h3>
<div id="stock-count" class="card">Loading stock coverage…</div>
<div id="stock-board">Loading stocks…</div>
<h3>Trades</h3>
<div id="trades">Loading trades...</div>

<script>
async function loadTrades(){
 try{
  const r=await fetch('/api/v2/trades');
  const trades=await r.json();

  document.getElementById('trades').innerHTML =
    trades.length ? trades.map(t=>`
      <div class="card">
        <b>${t.symbol}</b><br>
        Status: <b class="${t.status==='CLOSED'?'sell':t.status==='TARGET_1'?'target':'buy'}">${t.status}</b><br>
        Entry: ${t.entry_price}<br>
        Current: ${t.current_price}<br>
        ${t.status!=="CLOSED" ? `<span class="${Number(t.current_price)>=Number(t.entry_price) ? "profit" : "loss"}">Live P&L: ${(Number(t.current_price)-Number(t.entry_price)).toFixed(2)} (${(((Number(t.current_price)-Number(t.entry_price))/Number(t.entry_price))*100).toFixed(2)}%)</span><br>` : ""}
        ${t.status==="CLOSED" ? `<span class="${Number(t.realized_pnl)>=0 ? "profit" : "loss"}">Realized P&L: ${Number(t.realized_pnl).toFixed(2)} (${Number(t.realized_pnl_pct).toFixed(2)}%)</span><br>` : ""}
        ${t.status==="CLOSED" ? `Exit: ${t.exit_price}<br>Reason: ${t.exit_reason}<br>` : ""}
        Target 1: ${t.target_1}<br>
        Target 2: ${t.target_2}<br>
        Invalidation: ${t.invalidation}<br>
        <small>${t.signal_time}</small>
      </div>
    `).join('') : 'No trades yet';
 }catch(e){document.getElementById('trades').textContent='Trade history unavailable; retrying.';}
}
async function loadScanner(){
 try{
  const r=await fetch("/api/v2/scanner");
  if(!r.ok)throw Error("Scanner API HTTP "+r.status);
  const rows=await r.json();
  if(!Array.isArray(rows))throw Error("Invalid scanner response");
  const now=new Date();
  const istParts=new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Kolkata",weekday:"short",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(now);
  const part=t=>istParts.find(p=>p.type===t)?.value;
  const mins=Number(part("hour"))*60+Number(part("minute"));
  const closed=["Sat","Sun"].includes(part("weekday"))||mins<555||mins>=930;
  const isFresh=x=>{if(!x?.updated_at)return false;const stamp=Date.parse(String(x.updated_at).replace(" ","T")+"+05:30");return Number.isFinite(stamp)&&stamp<=now.getTime()&&now.getTime()-stamp<=180000;};
  const liveRows=rows.filter(isFresh);
  document.getElementById("feed-status").textContent=closed?"MARKET CLOSED — Stored prices are historical. No live BUY signals.":`Market open — ${liveRows.length} fresh records of ${rows.length}; stale signals excluded.`;
  const names = ["NIFTY 50", "BANK NIFTY", "SENSEX"];
  document.getElementById("indices").innerHTML = names.map(name => {
    const x = rows.find(r => r.symbol === name);
    const signal = closed ? "MARKET CLOSED" : !isFresh(x) ? "STALE DATA — WAIT" : (x?.signal || "WAITING");
    const cls = signal === "BUY" ? "buy" : signal === "SELL" ? "sell" : "";
    return `<div class="card"><b>${name}</b><br>
      Last stored price (not necessarily live): ${x?.price == null ? "Waiting..." : Number(x.price).toFixed(2)}<br>
      ${x?.previous_close > 0 && x?.price != null ? (() => {
        const change = Number(x.price) - Number(x.previous_close);
        const pct = change / Number(x.previous_close) * 100;
        const up = change >= 0;
        return `<span class="${up ? "buy" : "sell"}">${up ? "▲ UP" : "▼ DOWN"} ${change >= 0 ? "+" : ""}${change.toFixed(2)} (${pct >= 0 ? "+" : ""}${pct.toFixed(2)}%)</span><br>`;
      })() : "Daily change: Waiting...<br>"}
      EMA9: ${x?.ema9 == null ? "—" : Number(x.ema9).toFixed(2)} |
      EMA20: ${x?.ema20 == null ? "—" : Number(x.ema20).toFixed(2)}<br>
      Momentum: ${x?.momentum == null ? "—" : Number(x.momentum).toFixed(3)}%<br>
      Suggestion: <b class="${cls}">${signal}</b><br>
      <small>${x?.updated_at || ""}</small></div>`;
  }).join("");
  const setupResponse=await fetch('/api/v2/top-momentum-setups',{cache:'no-store'});
  if(!setupResponse.ok)throw Error('Setups API unavailable');
  const shortlist=await setupResponse.json();
  if(shortlist.order_execution_enabled!==false||shortlist.mode!=='MANUAL_RESEARCH_ONLY'||!Array.isArray(shortlist.setups))throw Error('Invalid safety status');
  const setups=closed?[]:shortlist.setups;
  const safeText=v=>String(v??'—').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  document.getElementById('scanner').innerHTML=setups.length?setups.map((s,i)=>`<div class="card"><b>#${i+1} ${safeText(s.symbol)}</b><br>Direction: BULLISH | Research signal: BUY<br>Indicative entry: ₹${safeText(s.indicative_entry)}<br>Target 1: ${s.target_1==null?'Not verified':safeText(s.target_1)} | Target 2: ${s.target_2==null?'Not verified':safeText(s.target_2)}<br>Stop-loss: ${s.stop_loss==null?'Not verified':safeText(s.stop_loss)}<br>Momentum: ${safeText(s.momentum_pct)}% | EMA9: ${safeText(s.ema9)} | EMA20: ${safeText(s.ema20)}<br>5-minute trend: ${safeText(s.trend_5m)}<br>Why selected: ${(s.reasons||[]).map(safeText).join(', ')}<br><small>Completed candle: ${safeText(s.candle_ist)} IST | Manual research only</small></div>`).join(''):`<div class="card">${closed?'Market closed — no live setups.':'No verified qualifying setups.'}<br><small>API: ${safeText(shortlist.status)} | Fresh stock rows: ${safeText(shortlist.fresh_stock_rows)} | Stale rejected: ${safeText(shortlist.rejected_stale_rows)}</small></div>`;

 }catch(e){document.getElementById("feed-status").textContent="Scanner data unavailable — NO LIVE SIGNALS";document.getElementById("indices").textContent="Data unavailable";document.getElementById("scanner").textContent="No verified BUY signals";}
}
async function loadStockBoard(){
 const count=document.getElementById('stock-count'),board=document.getElementById('stock-board');
 try{
  const r=await fetch('/api/v2/nifty200-stock-board',{cache:'no-store'});
  if(!r.ok)throw Error('Stock board unavailable');
  const data=await r.json();
  if(!Array.isArray(data.stocks))throw Error('Invalid stock board');
  const esc=v=>String(v??'—').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  count.textContent=`${data.universe_size} NIFTY 200 stocks configured | ${data.stocks_with_stored_data} with stored prices | ${data.stocks_with_fresh_data} fresh | ${data.status}. Historical data is not a live BUY signal.`;
  const sorted=[...data.stocks].sort((a,b)=>(b.data_status==='LIVE_FRESH')-(a.data_status==='LIVE_FRESH')||(b.last_price!=null)-(a.last_price!=null)||a.symbol.localeCompare(b.symbol));
  board.innerHTML=sorted.map(s=>`<div class="card"><b>${esc(s.symbol)}</b><br>Last stored price: ${esc(s.last_price)} | Momentum: ${esc(s.momentum_pct)}<br>Data: ${esc(s.data_status)} | Candle: ${esc(s.last_candle_ist)} IST<br>Current signal: ${esc(s.signal||'NO LIVE SIGNAL')}</div>`).join('');
 }catch(e){count.textContent='NIFTY 200 stock board unavailable';board.textContent='Could not load stock list; retrying.';}
}
loadScanner();
setInterval(loadScanner,10000);
loadStockBoard();
setInterval(loadStockBoard,30000);

loadTrades();
setInterval(loadTrades, 3000);
</script>
</body>
</html>
