<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NSE Momentum Scanner V2</title>
<style>
body{font-family:Arial;background:#10131a;color:#fff;margin:15px}
h2{color:#4ade80}
.card{background:#1c2230;padding:14px;margin:10px 0;border-radius:10px}
.buy{color:#4ade80}.sell{color:#fb7185}
small{color:#aaa}
.target{color:orange;font-weight:bold}
.profit{color:#4ade80;font-weight:bold}
.loss{color:#fb7185;font-weight:bold}
</style>
</head>
<body>
<h2>NSE Momentum Scanner V2</h2>
<h3>Market Index Signals</h3>
<div id="indices">Loading live indices...</div>
<h3>Top 5 BUY Stocks</h3>
<div id="scanner">Waiting for live market data...</div>
<h3>Trades</h3>
<div id="trades">Loading trades...</div>

<script>
async function loadTrades(){
  const r=await fetch('/api/v2/trades');
  const trades=await r.json();

  document.getElementById('trades').innerHTML =
    trades.length ? trades.map(t=>`
      <div class="card">
        <b>${t.symbol}</b><br>
        Status: <b class="${t.status==='CLOSED'?'sell':t.status==='TARGET_1'?'target':'buy'}">${t.status}</b><br>
        Entry: ${t.entry_price}<br>
        Current: ${t.current_price}<br>
        ${t.status!=="CLOSED" ? `<span class="${Number(t.current_price)>=Number(t.entry_price) ? "profit" : "loss"}">Live P&L: ${(Number(t.current_price)-Number(t.entry_price)).toFixed(2)} (${(((Number(t.current_price)-Number(t.entry_price))/Number(t.entry_price))*100).toFixed(2)}%)</span><br>` : ""}
        ${t.status==="CLOSED" ? `<span class="${Number(t.realized_pnl)>=0 ? "profit" : "loss"}">Realized P&L: ${Number(t.realized_pnl).toFixed(2)} (${Number(t.realized_pnl_pct).toFixed(2)}%)</span><br>` : ""}
        ${t.status==="CLOSED" ? `Exit: ${t.exit_price}<br>Reason: ${t.exit_reason}<br>` : ""}
        Target 1: ${t.target_1}<br>
        Target 2: ${t.target_2}<br>
        Invalidation: ${t.invalidation}<br>
        <small>${t.signal_time}</small>
      </div>
    `).join('') : 'No trades yet';
}
async function loadScanner(){
  const r=await fetch("/api/v2/scanner");
  const rows=await r.json();
  const names = ["NIFTY 50", "BANK NIFTY", "SENSEX"];
  document.getElementById("indices").innerHTML = names.map(name => {
    const x = rows.find(r => r.symbol === name);
    const now = new Date();
    const ist = new Date(now.toLocaleString("en-US", {timeZone:"Asia/Kolkata"}));
    const mins = ist.getHours()*60 + ist.getMinutes();
    const closed = ist.getDay()===0 || ist.getDay()===6 || mins<555 || mins>=930;
    const signal = closed ? "MARKET CLOSED" : (x?.signal || "WAITING");
    const cls = signal === "BUY" ? "buy" : signal === "SELL" ? "sell" : "";
    return `<div class="card"><b>${name}</b><br>
      Last Price: ${x?.price == null ? "Waiting..." : Number(x.price).toFixed(2)}<br>
      ${x?.previous_close > 0 && x?.price != null ? (() => {
        const change = Number(x.price) - Number(x.previous_close);
        const pct = change / Number(x.previous_close) * 100;
        const up = change >= 0;
        return `<span class="${up ? "buy" : "sell"}">${up ? "▲ UP" : "▼ DOWN"} ${change >= 0 ? "+" : ""}${change.toFixed(2)} (${pct >= 0 ? "+" : ""}${pct.toFixed(2)}%)</span><br>`;
      })() : "Daily change: Waiting...<br>"}
      EMA9: ${x?.ema9 == null ? "—" : Number(x.ema9).toFixed(2)} |
      EMA20: ${x?.ema20 == null ? "—" : Number(x.ema20).toFixed(2)}<br>
      Momentum: ${x?.momentum == null ? "—" : Number(x.momentum).toFixed(3)}%<br>
      Suggestion: <b class="${cls}">${signal}</b><br>
      <small>${x?.updated_at || ""}</small></div>`;
  }).join("");
  document.getElementById("scanner").innerHTML = rows.some(s=>s.signal==="BUY") ? rows.filter(s=>s.signal==="BUY" && !["NIFTY 50","BANK NIFTY","SENSEX"].includes(s.symbol)).sort((a,b)=>(Number(b.momentum)+100*(b.ema9-b.ema20)/b.price)-(Number(a.momentum)+100*(a.ema9-a.ema20)/a.price)).slice(0,5).sort((a,b)=>(["BUY","SELL","HOLD","WAITING"].indexOf(a.signal)-["BUY","SELL","HOLD","WAITING"].indexOf(b.signal))).map(s=>s.signal==="WAITING"?`<div class="card"><b>${s.symbol}</b><br>Signal: <b>WAITING</b></div>`:`<div class="card"><b>${s.symbol}</b><br>Price: ${s.price}<br>EMA9: ${Number(s.ema9).toFixed(2)} | EMA20: ${Number(s.ema20).toFixed(2)}<br>Momentum: ${Number(s.momentum).toFixed(2)}<br>Market: ${s.market} | 5M: ${s.trend_5m}<br>Signal: <b class="${s.signal==="BUY"?"buy":s.signal==="SELL"?"sell":""}">${s.signal}</b><br><small>${s.updated_at}</small></div>`).join("") : "No qualifying BUY stocks right now";
}
loadScanner();
setInterval(loadScanner,3000);

loadTrades();
setInterval(loadTrades, 3000);
</script>
</body>
</html>
