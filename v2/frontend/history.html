<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NSE V2 Trade History</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6fa;margin:0;padding:16px;color:#172033}
h2{margin-bottom:6px}
p{color:#667085}
button{background:#1769e0;color:white;border:0;border-radius:8px;padding:12px 16px;font-weight:bold}
.table-wrap{overflow-x:auto;background:white;border-radius:10px;margin-top:16px}
table{border-collapse:collapse;width:100%;min-width:780px}
th,td{padding:12px;text-align:left;border-bottom:1px solid #e6e9ef;white-space:nowrap;font-size:13px}
th{background:#eaf0fa}
.positive{color:green;font-weight:bold}
.negative{color:#d12b2b;font-weight:bold}
</style>
</head>
<body>
<h2>NSE Momentum Scanner V2</h2>
<p>Daily Completed Trade History</p>
<button onclick="downloadCSV()">Download CSV</button>
<p id="status">Loading trades...</p>
<div class="table-wrap">
<table>
<thead><tr>
<th>Date</th><th>Stock</th><th>Buy Time</th><th>Buy Price</th>
<th>Sell Time</th><th>Sell Price</th><th>Qty</th>
<th>P&L</th><th>P&L %</th><th>Exit Reason</th>
</tr></thead>
<tbody id="rows"></tbody>
</table>
</div>
<script>
const API="https://nse-momentum-scanner-api.onrender.com/api/v2/history";
let trades=[];
const escapeHTML=v=>String(v??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
async function loadTrades(){
try{
const response=await fetch(API);
if(!response.ok)throw new Error("HTTP "+response.status);
const data=await response.json();
if(!Array.isArray(data))throw new Error("Unexpected API response");
trades=data;
document.getElementById("status").textContent=trades.length+
" completed trade(s)";
document.getElementById("rows").innerHTML=trades.map(t=>{
const pnl=Number(t.pnl_total);
const cls=Number.isFinite(pnl)?(pnl>=0?"positive":"negative"):"";
return "<tr>"+[
t.trade_date,t.symbol,t.buy_time,t.buy_price,t.sell_time,
t.sell_price,t.quantity,t.pnl_total,t.pnl_pct,t.exit_reason
].map((v,i)=>"<td"+(i===7?' class="'+cls+'"':"")+">"+
escapeHTML(v)+"</td>").join("")+"</tr>";
}).join("");
}catch(e){
document.getElementById("status").textContent="Unable to load trades: "+e.message;
}
}
function downloadCSV(){
const fields=["trade_date","symbol","buy_time","buy_price","sell_time",
"sell_price","quantity","pnl_total","pnl_pct","exit_reason"];
const csv=[fields.join(","),...trades.map(t=>fields.map(k=>
'"'+String(t[k]??"").replace(/"/g,'""')+'"').join(","))].join("\r\n");
const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
const a=document.createElement("a");
a.href=url;a.download="nse_v2_trade_history.csv";a.click();
setTimeout(()=>URL.revokeObjectURL(url),1000);
}
loadTrades();
</script>
</body>
</html>
