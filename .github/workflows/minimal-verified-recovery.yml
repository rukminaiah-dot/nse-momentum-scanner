name: Minimal Verified Recovery Tests
on:
  push:
    branches:
      - feature/minimal-verified-candle-recovery
  pull_request:
    paths:
      - 'v2/backend/verified_gap_recovery.py'
      - 'v2/backend/gap_recovery_worker.py'
      - 'tests/test_minimal_verified_recovery.py'
      - '.github/workflows/minimal-verified-recovery.yml'
  workflow_dispatch:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile recovery modules
        run: python -m py_compile v2/backend/verified_gap_recovery.py v2/backend/gap_recovery_worker.py tests/test_minimal_verified_recovery.py probe_upstox_recovery.py
      - name: Run isolated offline tests
        run: python -m unittest discover -s tests -p 'test_minimal_verified_recovery.py' -v
