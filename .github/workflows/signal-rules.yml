name: Scanner Signal Rule Tests
on:
  pull_request:
    paths:
      - 'v2/backend/scanner.py'
      - 'v2/backend/signal_engine.py'
      - 'v2/backend/offline_signal_parity.py'
      - 'v2/backend/volume_metrics.py'
      - 'tests/test_signal_engine.py'
      - 'tests/test_volume_metrics.py'
      - 'tests/test_offline_signal_parity.py'
      - 'tests/test_scanner_source_decision_parity.py'
      - 'tests/test_scanner_trend_source_parity.py'
      - 'tests/test_scanner_decision_safety_contract.py'
      - '.github/workflows/signal-rules.yml'
  push:
    branches:
      - '**'
jobs:
  signal-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile v2/backend/scanner.py v2/backend/signal_engine.py v2/backend/offline_signal_parity.py
      - run: python -m unittest discover -s tests -p 'test_signal_engine.py' -v
      - run: python -m unittest discover -s tests -p 'test_volume_metrics.py' -v
      - run: python -m unittest discover -s tests -p 'test_offline_signal_parity.py' -v
      - run: python -m unittest discover -s tests -p 'test_scanner_source_decision_parity.py' -v
      - run: python -m unittest discover -s tests -p 'test_scanner_trend_source_parity.py' -v
      - run: python -m unittest discover -s tests -p 'test_scanner_decision_safety_contract.py' -v
