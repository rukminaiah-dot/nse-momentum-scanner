name: Android Paper Scanner Prototype

on:
  push:
    branches:
      - experiment/android-paper-scanner
    paths:
      - "mobile/**"
      - ".github/workflows/android-paper-prototype.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android-paper-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        run: |
          curl --fail --location --silent --show-error https://services.gradle.org/distributions/gradle-8.9-bin.zip --output /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Run unit tests and build debug APK
        working-directory: mobile
        run: /tmp/gradle-8.9/bin/gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify release signing fails closed without private credentials
        working-directory: mobile
        shell: bash
        run: |
          if /tmp/gradle-8.9/bin/gradle --no-daemon :app:preReleaseBuild > "$RUNNER_TEMP/signing-check.log" 2>&1; then
            echo "::error::Release unexpectedly accepted missing signing credentials"
            exit 1
          fi
          grep -q "Persistent Android signing is not configured" "$RUNNER_TEMP/signing-check.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-unit-test-results
          path: mobile/app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: nse-paper-scanner-debug-apk
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
