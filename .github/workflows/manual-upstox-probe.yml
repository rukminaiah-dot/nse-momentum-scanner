name: Manual Upstox Read-Only Integration Probe

# Manually dispatched only; never runs on push, PR, or schedule.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-upstox-read-only-probe
  cancel-in-progress: false

jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed Fix 10 probe commit (not production scanner)
        uses: actions/checkout@v4
        with:
          ref: 75a3332fd2fcaa4dbf65a4429b00fbe4de379f9a
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline regression gate before any broker API call
        run: python -m unittest -v test_verified_gap_recovery test_gap_recovery_worker test_recovery_trigger test_recovery_integration test_preload_control_flow test_upstox_probe
      - name: Install Upstox SDK (read-only request)
        run: python -m pip install upstox-python-sdk
      - name: Verify Actions secret exists without printing it
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: |
          if [ -z "$UPSTOX_ACCESS_TOKEN" ]; then
            echo "BLOCKED: UPSTOX_ACCESS_TOKEN Actions secret is unavailable"
            exit 2
          fi
      - name: Validate authenticated one-minute candles without orders
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: python probe_upstox_recovery.py --instrument-key 'NSE_EQ|INE974X01010'
