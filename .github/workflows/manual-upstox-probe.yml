name: Manual Upstox Read-Only Integration Probe

# Manually dispatched only; never runs on push, PR, or schedule.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-upstox-read-only-probe
  cancel-in-progress: false

jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed Fix 10 probe commit (not production scanner)
        uses: actions/checkout@v4
        with:
          ref: 0d6f6c7abf416bffad13b69ed681289a4344bd5f
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Upstox SDK (read-only request)
        run: python -m pip install upstox-python-sdk
      - name: Verify Actions secret exists without printing it
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: |
          if [ -z "$UPSTOX_ACCESS_TOKEN" ]; then
            echo "BLOCKED: UPSTOX_ACCESS_TOKEN Actions secret is unavailable"
            exit 2
          fi
      - name: Validate authenticated one-minute candles without orders
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: python probe_upstox_recovery.py --instrument-key 'NSE_EQ|INE974X01010'
