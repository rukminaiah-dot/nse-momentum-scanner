name: Manual Upstox Read-Only Integration Probe

# Manual-only: never runs on push, PR, schedule or production deploy.
on:
  workflow_dispatch:
    inputs:
      instrument_key:
        description: 'Authorized Upstox instrument key to test (not a credential)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: manual-upstox-probe
  cancel-in-progress: false

jobs:
  probe:
    if: github.ref == 'refs/heads/feature/verified-gap-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Confirm feature branch checkout is isolated
        run: |
          test "$GITHUB_REF" = 'refs/heads/feature/verified-gap-recovery'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Record isolated acceptance revision
        run: |
          echo "Acceptance commit: $GITHUB_SHA"
          echo "Acceptance ref: $GITHUB_REF"
      - name: Run offline recovery and websocket regression tests
        run: |
          python -m compileall -q preflight_upstox_websocket.py probe_upstox_websocket_smoke.py isolated_live_tick_candles.py isolated_stream_recovery.py isolated_upstox_history.py v2/backend
          python -m unittest -v tests/test_websocket_preflight.py test_websocket_smoke test_isolated_live_tick_candles test_isolated_stream_recovery test_gap_recovery_worker test_verified_gap_recovery test_isolated_upstox_history
      - name: Install read-only SDK
        run: python -m pip install upstox-python-sdk
      - name: Verify secret presence without printing its value
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: |
          if [ -z "$UPSTOX_ACCESS_TOKEN" ]; then
            echo "BLOCKED: repository Actions secret UPSTOX_ACCESS_TOKEN is unavailable"
            exit 2
          fi
      - name: Probe authenticated intraday candles (no orders)
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          INSTRUMENT_KEY: ${{ inputs.instrument_key }}
        run: python probe_upstox_recovery.py --instrument-key "$INSTRUMENT_KEY"

      - name: Test isolated live websocket recovery (no orders)
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          FIX10_TEST_INSTRUMENT_KEY: ${{ inputs.instrument_key }}
          FIX10_NONPRODUCTION_ACK: I_AM_IN_AN_ISOLATED_TEST
          FIX10_LIVE_STREAM_ACK: READ_ONLY_STREAM_TEST
          FIX10_ISOLATED_RECOVERY_ACK: READ_ONLY_HISTORY
          ENABLE_VERIFIED_GAP_RECOVERY: 'false'
        run: python probe_upstox_websocket_smoke.py
