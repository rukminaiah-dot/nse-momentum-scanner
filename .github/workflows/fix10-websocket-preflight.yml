name: Fix 10 Websocket Preflight Tests

# Offline only: no broker credentials, network subscriptions or deployments.
on:
  pull_request:
    paths:
      - 'preflight_upstox_websocket.py'
      - 'tests/test_websocket_preflight.py'
      - 'isolated_live_tick_candles.py'
      - 'isolated_stream_recovery.py'
      - 'isolated_upstox_history.py'
      - 'test_isolated_upstox_history.py'
      - 'v2/backend/candle_manager.py'
      - 'v2/backend/gap_recovery_worker.py'
      - 'v2/backend/verified_gap_recovery.py'
      - 'test_gap_recovery_worker.py'
      - 'test_verified_gap_recovery.py'
      - 'test_isolated_live_tick_candles.py'
      - 'test_isolated_stream_recovery.py'
      - 'probe_upstox_websocket_smoke.py'
      - 'test_websocket_smoke.py'
      - '.github/workflows/fix10-websocket-preflight.yml'
      - '.github/workflows/manual-upstox-probe.yml'
  push:
    branches:
      - feature/verified-gap-recovery
    paths:
      - 'preflight_upstox_websocket.py'
      - 'tests/test_websocket_preflight.py'
      - 'isolated_live_tick_candles.py'
      - 'isolated_stream_recovery.py'
      - 'isolated_upstox_history.py'
      - 'test_isolated_upstox_history.py'
      - 'v2/backend/candle_manager.py'
      - 'v2/backend/gap_recovery_worker.py'
      - 'v2/backend/verified_gap_recovery.py'
      - 'test_gap_recovery_worker.py'
      - 'test_verified_gap_recovery.py'
      - 'test_isolated_live_tick_candles.py'
      - 'test_isolated_stream_recovery.py'
      - 'probe_upstox_websocket_smoke.py'
      - 'test_websocket_smoke.py'
      - '.github/workflows/fix10-websocket-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run fail-closed websocket preflight tests (no secrets)
        run: |
          python -m compileall -q preflight_upstox_websocket.py probe_upstox_websocket_smoke.py isolated_live_tick_candles.py isolated_stream_recovery.py isolated_upstox_history.py v2/backend
          python -m unittest -v tests/test_websocket_preflight.py test_websocket_smoke test_isolated_live_tick_candles test_isolated_stream_recovery test_gap_recovery_worker test_verified_gap_recovery test_isolated_upstox_history
