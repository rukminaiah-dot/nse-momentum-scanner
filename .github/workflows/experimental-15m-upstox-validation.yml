name: Experimental 15m Read-Only Upstox Check

# Path-filtered PR runs keep this branch-only check runnable without merging it.
# The fallback is intentionally 5 symbols; larger batches are opt-in through workflow_dispatch.
# Re-trigger this path after the first 15-minute candle closes for live-data smoke checks.
# Live signal checks must stay paper-only while the same-session breakout bars form.
# Temporary live-market validation trigger; this branch is not intended to merge.
on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/experimental-15m-upstox-validation.yml
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of NSE symbols (1-200); start with 5'
        required: true
        default: '5'
        type: choice
        options: ['5', '20', '50', '200']

permissions:
  contents: read

concurrency:
  group: experimental-15m-upstox-validation
  cancel-in-progress: false

jobs:
  paper-market-data-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SYMBOL_LIMIT: ${{ inputs.limit || '5' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only data dependency
        run: pip install upstox-python-sdk
      - name: Require configured secret
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: |
          if [ -z "$UPSTOX_ACCESS_TOKEN" ]; then
            echo "::error::UPSTOX_ACCESS_TOKEN secret not available to this workflow"
            exit 1
          fi
      - name: Validate Upstox 15m data without orders
        shell: bash
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: |
          python -m v2.backend.experimental_15m_upstox_runner --limit "$SYMBOL_LIMIT" > /tmp/15m-paper-results.json
          python - <<'PY'
          import json
          from collections import Counter
          with open("/tmp/15m-paper-results.json") as handle:
              data = json.load(handle)
          if data.get("mode") != "PAPER":
              raise SystemExit("Unexpected execution mode")
          requested = data.get("requested_count", 0)
          fetched = data.get("universe_count", 0)
          errors = data.get("fetch_errors", {})
          print("Paper-only 15m data check")
          print("Requested:", requested, "Fetched:", fetched, "Fetch failures:", len(errors))
          quality = data.get("data_quality", {})
          print("Selected:", data.get("selected_count", 0))
          print("Historical candles:", sum(row.get("historical_candles", 0) for row in quality.values()))
          print("Verified 20-session 09:15 baselines:", sum(row.get("open_slot_baseline_verified", False) for row in quality.values()))
          print("Completed intraday candles:", sum(row.get("completed_intraday_candles", 0) for row in quality.values()))
          print("Exclusions:", dict(Counter(data.get("excluded", {}).values())))
          print("Fetch failure types:", dict(Counter(errors.values())))
          for row in data.get("selected", []):
              details = row.get("details", {})
              print("Paper candidate:", row.get("symbol"), "| candle:", row.get("candle_time"), "| RVOL:", row.get("relative_volume"), "| signal:", row.get("signal"), "| K/D:", details.get("stoch_k"), "/", details.get("stoch_d"), "| technical:", details.get("reason", row.get("reason")))
          if fetched == 0:
              raise SystemExit("No authenticated 15m market data retrieved")
          if errors:
              raise SystemExit("Some symbol fetches failed; review API limits/data availability")
          PY
          rm -f /tmp/15m-paper-results.json
