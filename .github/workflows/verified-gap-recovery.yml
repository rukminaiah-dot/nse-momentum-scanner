name: Verified Gap Recovery Tests
on:
  push:
    branches: [feature/verified-gap-recovery]
  pull_request:
    paths:
      - 'v2/backend/**'
      - 'test_verified_gap_recovery.py'
      - 'test_gap_recovery_worker.py'
      - 'test_recovery_trigger.py'
      - 'test_recovery_integration.py'
      - 'test_preload_control_flow.py'
      - 'test_upstox_probe.py'
      - 'test_paper_signal_ledger.py'
      - 'test_signal_accuracy_report.py'
      - 'test_signal_archive_postgres.py'
      - 'test_signal_archive_sync.py'
      - 'test_signal_cumulative_report.py'
      - 'test_signal_archive_cli.py'
      - 'test_signal_accuracy_csv.py'
      - 'probe_upstox_recovery.py'

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile recovery modules
        run: python -m compileall -q v2/backend probe_upstox_recovery.py
      - name: Offline regression suite
        run: python -m unittest -v test_verified_gap_recovery test_gap_recovery_worker test_recovery_trigger test_recovery_integration test_preload_control_flow test_upstox_probe test_paper_signal_ledger test_signal_accuracy_report test_signal_archive_postgres test_signal_archive_sync test_signal_cumulative_report test_signal_archive_cli test_signal_accuracy_csv
