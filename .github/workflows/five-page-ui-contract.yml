name: Five-Page UI Contract Tests
on:
  push:
    branches:
      - feature/isolated-recovery-worker-manager-integration
  pull_request:
  workflow_dispatch:
jobs:
  ui-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check five-page UI contract
        run: python -m unittest discover -s tests -p 'test_five_page_ui.py' -v
