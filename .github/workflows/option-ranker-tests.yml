name: Option ranker safety tests

on:
  push:
    branches: [main]
    paths:
      - 'v2/backend/option_contract_ranker.py'
      - 'tests/test_option_contract_ranker.py'
      - '.github/workflows/option-ranker-tests.yml'
  pull_request:
    paths:
      - 'v2/backend/option_contract_ranker.py'
      - 'tests/test_option_contract_ranker.py'
      - '.github/workflows/option-ranker-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test option contract ranking
        run: python -m unittest discover -s tests -p 'test_option_contract_ranker.py' -v
